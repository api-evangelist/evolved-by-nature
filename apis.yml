- aid: evolved-by-nature-bioactives-commerce
  name: Evolved By Nature Bioactives Store — Agentic Commerce API
  description: >-
    The agent-callable commerce surface of the Evolved By Nature bioactives store, which sells
    Activated Silk ingredient grades to formulators. Same deployment as the skincare storefront — a
    UCP 2026-04-08 MCP endpoint with 13 tools, a Shopify storefront MCP endpoint with 5 tools, and an
    introspectable Shopify Storefront GraphQL API — backed by a separate shop and OAuth issuer.
