aid: evolved-by-nature
name: Evolved By Nature
description: >-
  Evolved By Nature is a Needham, Massachusetts biotechnology company — formerly Silk Therapeutics —
  that develops Activated Silk, a platform of liquid silk-derived molecules used as renewable
  bioactive ingredients and performance chemistries across personal care, skincare, leather
  finishing and textiles. The company sells physical product rather than software: there is no
  developer program, no OpenAPI and no API key issuance. Its only live machine-readable API surface
  is the agentic-commerce layer on its two Shopify storefronts, where UCP (Universal Commerce
  Protocol) and Shopify storefront MCP endpoints, a storefront GraphQL API, llms.txt and agents.md
  are served anonymously from evolvedbynature.com hosts.
