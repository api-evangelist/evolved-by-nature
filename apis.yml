apis:
- aid: evolved-by-nature-skincare-commerce
  name: Evolved By Nature Skincare Store — Agentic Commerce API
  description: >-
    The agent-callable commerce surface of the Evolved By Nature direct-to-consumer skincare store.
    A UCP 2026-04-08 MCP endpoint exposes 13 catalog, cart, checkout and order tools; a second
    Shopify storefront MCP endpoint exposes 5 shopping tools; a Shopify Storefront GraphQL API
    (2025-07) answers unauthenticated introspection. Discovery requires no credentials; completing a
    checkout requires explicit buyer approval.
  humanURL: https://skincare.evolvedbynature.com
