name: Evolved By Nature — MCP servers
description: >-
  Evolved By Nature operates no developer program and publishes no OpenAPI. Its only live,
  machine-readable, callable API surface is the agentic-commerce layer on its two Shopify
  storefronts: a UCP (Universal Commerce Protocol) MCP endpoint and a Shopify storefront MCP
  endpoint, both answering `tools/list` anonymously over JSON-RPC 2.0.
ownership_note: >-
  Shopify-platform-provided surface served first-party from Evolved By Nature's own hosts (skincare.evolvedbynature.com / bioactives.evolvedbynature.com). The documents self-identify as "Evolved By Nature's online store" and the storefront GraphQL reports shop.name "Evolved By Nature"; the UCP discovery document names the backing shops ebn-skincare.myshopify.com and ebn-bioactives.myshopify.com. The tool surface is templated by Shopify and is identical across Shopify stores — it is Evolved By Nature's deployment of it, not a contract Evolved By Nature authored.
