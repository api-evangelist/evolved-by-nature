notes:
- The two storefronts expose byte-identical tool sets; only the backing shop and OAuth issuer differ.
- Tool inputSchemas are JSON Schema 2020-12 and are captured verbatim in the raw_captures files.
- Every UCP tool requires a `meta.ucp-agent.profile` URI; calls without it return JSON-RPC error
  -32001 `invalid_profile_url` with HTTP 422 (observed 2026-08-12).
- Checkout completion requires contemporaneous human approval per the provider-served agents.md
  and robots.txt; agents must not finalize payment autonomously.
